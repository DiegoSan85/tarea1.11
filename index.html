<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.11 - Tablas HTML</title>
    <!-- Los bordes van en CSS y no con los atributos border, align o bgcolor porque esos atributos son obsoletos en HTML5: el HTML solo debe describir el contenido y su estructura, y el aspecto visual se separa en la hoja de estilos, así se puede cambiar el diseño de toda la web desde un solo archivo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- table: crea una tabla para organizar datos en filas y columnas -->
    <table>
        <!-- caption: es el título de la tabla, describe qué contiene y se muestra encima de ella -->
        <caption>Horario de 1º DAW</caption>
    </table>
</body>
</html>
